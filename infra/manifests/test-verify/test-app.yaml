apiVersion: v1
kind: Namespace
metadata:
  name: pushr-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-nginx
  namespace: pushr-test
  labels:
    app: test-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-nginx
  template:
    metadata:
      labels:
        app: test-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: test-nginx
  namespace: pushr-test
spec:
  selector:
    app: test-nginx
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-nginx-ingress
  namespace: pushr-test
  annotations:
    cert-manager.io/cluster-issuer: pushr-selfsigned-issuer
    ingress.class: traefik
spec:
  tls:
  - hosts:
    - test.pushr.localhost
    secretName: test-pushr-tls
  rules:
  - host: test.pushr.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: test-nginx
            port:
              number: 80
